<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>应急交接单 · Offline Handover</title>
<style>
  :root {
    --ink: #14161a;
    --ink-soft: #3a3d44;
    --paper: #fffdf7;
    --line: #e6e2d6;
    --muted: #8a8779;
    --accent: #ffde59;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f4f1e8;
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    padding: 20px 14px 56px;
  }
  main { width: min(100%, 760px); margin: 0 auto; }
  .head {
    background: var(--ink);
    color: #fff;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 18px 20px;
    border-left: 8px solid var(--accent);
  }
  .head h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
  .head p { margin: 6px 0 0; color: rgba(255,255,255,.82); font-size: 12px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 0;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 18px 20px 22px;
  }
  .note {
    background: #fff6d6;
    border: 1px solid #f0dfa0;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: #6b5c14;
    margin-bottom: 14px;
  }
  .row { display: grid; grid-template-columns: 88px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  .row label { font-size: 13px; color: var(--muted); }
  input[type="text"], input[type="date"], textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    padding: 10px 12px;
  }
  textarea { min-height: 340px; line-height: 1.7; font-size: 14px; resize: vertical; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  button {
    border: 1px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-weight: 700;
    padding: 10px 18px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  .status { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 18px; }
  .foot { margin-top: 18px; font-size: 11px; color: var(--muted); }
  @media print {
    body { background: #fff; padding: 0; }
    .actions, .note, .foot, .row label { display: none; }
    .row { grid-template-columns: 1fr; }
    input, textarea { border: 0; padding: 0; }
    textarea { min-height: 0; height: auto; overflow: visible; }
  }
</style>
</head>
<body>
<main>
  <header class="head">
    <h1>应急交接 · EMERGENCY HANDOVER</h1>
    <p>本页不联网也能用（已随站点缓存）。数据库不可写时用它记录交接，恢复后在系统内导入文字版。</p>
  </header>
  <section class="card">
    <div class="note">用法：填写 / 修改下方文字（可直接写「谁把哪台车交给了谁」），点「复制文字」发到工作群，或点「下载图片」保存；第二天在 Workshop「应急交接」里导入这段文字。</div>
    <div class="row"><label for="store">门店</label><input id="store" type="text" placeholder="例如：南宁五象店" /></div>
    <div class="row"><label for="day">日期</label><input id="day" type="date" /></div>
    <textarea id="sheet" spellcheck="false"></textarea>
    <div class="actions">
      <button type="button" class="primary" id="copy">复制文字</button>
      <button type="button" id="image">下载图片</button>
      <button type="button" id="print">打印</button>
      <button type="button" id="reset">重置模板</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <p class="foot">离线可用 · 不向任何服务器发送数据 · 关闭页面前建议先复制 / 下载图片</p>
  </section>
</main>
<script>
(function () {
  var storeInput = document.getElementById('store');
  var dayInput = document.getElementById('day');
  var sheet = document.getElementById('sheet');
  var status = document.getElementById('status');

  function pad(n) { return String(n).padStart(2, '0'); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function clock() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function template() {
    var name = storeInput.value.trim() || '门店';
    var day = dayInput.value || today();
    return [
      '【应急交接单 · 未入账】',
      '门店：' + name,
      '日期：' + day + ' ' + clock(),
      '说明：数据库暂时无法写入，本单仅作应急凭证；恢复后在系统「应急交接」中导入。',
      '',
      '— 待取车辆 —',
      '1. ',
      '',
      '— 维修交接 —',
      '1. ',
      '',
      '— 其它交接 —',
      '1. ',
      '',
      '补充（经手人 / 实际交付情况）：',
      '- '
    ].join('\n');
  }

  function reset() {
    dayInput.value = today();
    sheet.value = template();
    status.textContent = '';
  }
  storeInput.addEventListener('input', function () { /* 仅影响下次重置 */ });
  dayInput.addEventListener('change', function () { /* 同上 */ });

  document.getElementById('reset').addEventListener('click', reset);

  document.getElementById('copy').addEventListener('click', function () {
    var text = sheet.value;
    function fallback() {
      sheet.focus(); sheet.select();
      try { document.execCommand('copy'); status.textContent = '已复制（兼容模式）。'; }
      catch (error) { status.textContent = '复制失败：请手动全选复制。'; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = '已复制到剪贴板。'; }, fallback);
    } else { fallback(); }
  });

  document.getElementById('print').addEventListener('click', function () { window.print(); });

  function wrap(ctx, text, maxWidth) {
    var out = [];
    var current = '';
    for (var i = 0; i < text.length; i += 1) {
      var next = current + text[i];
      if (ctx.measureText(next).width > maxWidth && current) { out.push(current); current = text[i]; }
      else { current = next; }
    }
    if (current) out.push(current);
    return out.length ? out : [''];
  }

  function render() {
    var W = 1000, PAD = 56, header = 172, footer = 120, lineHeight = 40;
    var text = sheet.value;
    var measure = document.createElement('canvas').getContext('2d');
    measure.font = '500 26px "Noto Sans SC", sans-serif';
    var lines = [];
    text.split('\n').forEach(function (raw) {
      if (!raw.trim()) { lines.push(''); return; }
      wrap(measure, raw, W - PAD * 2).forEach(function (item) { lines.push(item); });
    });
    var height = header + PAD + Math.max(lines.length, 1) * lineHeight + PAD + footer;
    var canvas = document.createElement('canvas');
    var ratio = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = W * ratio; canvas.height = height * ratio;
    var ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.fillStyle = '#fffdf7'; ctx.fillRect(0, 0, W, height);
    ctx.fillStyle = '#14161a'; ctx.fillRect(0, 0, W, header);
    ctx.fillStyle = '#ffde59'; ctx.fillRect(PAD, 40, 8, 92);
    ctx.fillStyle = '#ffffff'; ctx.font = '700 60px "Barlow Condensed", "Noto Sans SC", sans-serif';
    ctx.fillText('EMERGENCY HANDOVER', PAD + 28, 96);
    ctx.font = '500 26px "Noto Sans SC", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.82)';
    ctx.fillText('应急交接 · ' + (storeInput.value.trim() || '门店'), PAD + 28, 132);
    ctx.textAlign = 'right'; ctx.fillText(sheet.value.indexOf('【应急交接单') === 0 ? '未入账凭证' : '应急凭证', W - PAD, 96);
    ctx.font = '500 24px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#ffde59';
    ctx.fillText(dayInput.value + ' ' + clock(), W - PAD, 132);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#3a3d44'; ctx.font = '500 26px "Noto Sans SC", sans-serif';
    var y = header + PAD + 26;
    lines.forEach(function (line) { if (line) ctx.fillText(line, PAD, y); y += lineHeight; });
    var footerY = header + PAD + Math.max(lines.length, 1) * lineHeight + 24;
    ctx.strokeStyle = '#e6e2d6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(PAD, footerY); ctx.lineTo(W - PAD, footerY); ctx.stroke();
    ctx.fillStyle = '#8a8779'; ctx.font = '500 22px "Noto Sans SC", sans-serif';
    ctx.fillText('应急交接凭证（未入账）· 恢复后在 Workshop 系统「应急交接」中导入本文字版', PAD, footerY + 46);
    return canvas;
  }

  document.getElementById('image').addEventListener('click', function () {
    try {
      var canvas = render();
      canvas.toBlob(function (blob) {
        if (!blob) { status.textContent = '图片生成失败。'; return; }
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = '应急交接-' + (dayInput.value || today()) + '.png';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        status.textContent = '图片已生成（若未自动下载，请长按 / 右键保存）。';
      }, 'image/png');
    } catch (error) { status.textContent = '图片生成失败：' + (error && error.message ? error.message : error); }
  });

  reset();
  // 尝试恢复上次内容（同一浏览器、仅本机）
  try {
    var saved = window.localStorage.getItem('bike-ops:emergency-static-sheet');
    if (saved) { var parsed = JSON.parse(saved); if (parsed && parsed.text) { sheet.value = parsed.text; if (parsed.store) storeInput.value = parsed.store; if (parsed.day) dayInput.value = parsed.day; } }
  } catch (error) { /* 忽略 */ }
  function persist() {
    try { window.localStorage.setItem('bike-ops:emergency-static-sheet', JSON.stringify({ text: sheet.value, store: storeInput.value, day: dayInput.value })); } catch (error) { /* 忽略 */ }
  }
  sheet.addEventListener('input', persist);
  storeInput.addEventListener('input', persist);
  dayInput.addEventListener('change', persist);
})();
</script>
</body>
</html>
