name: One-shot EdgeOne version repair

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: one-shot-edgeone-version-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'chore(ci): add one-shot EdgeOne version repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Activate pinned pnpm
        run: corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare the final repository tree and V5.3.2 metadata
        run: |
          rm .github/workflows/repair-edgeone-version.yml
          pnpm version:patch -- \
            --title "EdgeOne 安装兼容修复" \
            --summary "修复 EdgeOne 只读构建环境中的 Corepack 安装失败，并同步部署治理测试。" \
            --change "EdgeOne 安装与构建改用固定版本的 corepack pnpm，不再向 /usr/local/bin 写入 shim。" \
            --change "同步 Workflow 治理验证器和部署测试，确保配置与 CI 期望一致。"
          pnpm version:stamp
      - name: Validate the exact final tree
        run: |
          pnpm check:workflows
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Commit the verified V5.3.2 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json apps/web/src/data/releaseNotes.js version-manifest.json
          git diff --cached --check
          git commit -m "fix(edgeone): register shimless install release"
          git push origin HEAD:develop
