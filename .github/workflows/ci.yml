name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bike_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Validate workflow policy
        run: pnpm check:workflows
      - name: Validate checksum migration runner on PostgreSQL 16
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bike_ops_test?sslmode=disable
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d bike_ops_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          SQL
          pnpm --filter @bike-ops/database migrate
          pnpm --filter @bike-ops/database migrate
          test "$(psql -At -h 127.0.0.1 -U postgres -d bike_ops_test -c 'select count(*) from public.bike_ops_schema_migrations')" = "1"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify frontend has no native select or legacy sample identity
        run: |
          ! grep -R '<select' apps/web/src
          ! grep -R '周宁章' apps/web/dist

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/$archive" "$url"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin"
          "$RUNNER_TEMP/gitleaks-bin" version
      - name: Scan complete Git history for secrets
        run: >-
          "$RUNNER_TEMP/gitleaks-bin" git
          --redact=100
          --no-banner
          --verbose
          --log-opts="--all --full-history --no-merges"
          --report-format=sarif
          --report-path=gitleaks-results.sarif
          .
      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results-${{ github.run_id }}
          path: gitleaks-results.sarif
          if-no-files-found: error
          retention-days: 30
