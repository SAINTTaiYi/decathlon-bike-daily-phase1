name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  repair_version:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore(ci): run one-shot version repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Activate pinned pnpm
        run: corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore canonical CI and register V5.3.2
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm version:patch -- \
            --title "EdgeOne 安装兼容修复" \
            --summary "修复 EdgeOne 只读构建环境中的 Corepack 安装失败，并同步部署治理测试。" \
            --change "EdgeOne 安装与构建改用固定版本的 corepack pnpm，不再向 /usr/local/bin 写入 shim。" \
            --change "同步 Workflow 治理验证器和部署测试，确保配置与 CI 期望一致。"
          pnpm version:stamp
      - name: Validate the exact final tree
        run: |
          pnpm check:workflows
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Push verified V5.3.2 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml package.json apps/web/package.json apps/web/src/data/releaseNotes.js version-manifest.json
          git diff --cached --check
          git commit -m "fix(edgeone): register shimless install release"
          git push origin HEAD:develop

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bike_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Validate workflow policy
        run: pnpm check:workflows
      - name: Validate checksum migration runner on PostgreSQL 16
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bike_ops_test?sslmode=disable
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d bike_ops_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          SQL
          pnpm --filter @bike-ops/database migrate
          pnpm --filter @bike-ops/database migrate
          test "$(psql -At -h 127.0.0.1 -U postgres -d bike_ops_test -c 'select count(*) from public.bike_ops_schema_migrations')" = "3"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify frontend has no native select or legacy sample identity
        run: |
          ! grep -R '<select' apps/web/src
          ! grep -R '周宁章' apps/web/dist

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/$archive" "$url"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin"
          "$RUNNER_TEMP/gitleaks-bin" version
      - name: Scan complete Git history for secrets
        run: >-
          "$RUNNER_TEMP/gitleaks-bin" git
          --redact=100
          --no-banner
          --verbose
          --log-opts="--all --full-history --no-merges"
          --report-format=sarif
          --report-path=gitleaks-results.sarif
          .
      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results-${{ github.run_id }}
          path: gitleaks-results.sarif
          if-no-files-found: error
          retention-days: 30
