name: Deploy Cloudflare staging · free stack

on:
  workflow_dispatch:
    inputs:
      confirm_free_plan:
        description: Confirm Cloudflare Workers/D1 remain on free plan
        required: true
        type: boolean
        default: false
      confirm_no_billing:
        description: Confirm paid plans, usage-based billing, and automatic upgrades are disabled
        required: true
        type: boolean
        default: false
      confirm_staging_only:
        description: Confirm this run deploys Staging only and Production remains forbidden
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/cloudflare-workers-d1' || github.ref == 'refs/heads/develop'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Enforce free-tier confirmations
        env:
          CONFIRM_FREE_PLAN: ${{ inputs.confirm_free_plan }}
          CONFIRM_NO_BILLING: ${{ inputs.confirm_no_billing }}
          CONFIRM_STAGING_ONLY: ${{ inputs.confirm_staging_only }}
        run: |
          test "$CONFIRM_FREE_PLAN" = true || { echo "::error::confirm_free_plan=true required"; exit 1; }
          test "$CONFIRM_NO_BILLING" = true || { echo "::error::confirm_no_billing=true required"; exit 1; }
          test "$CONFIRM_STAGING_ONLY" = true || { echo "::error::confirm_staging_only=true required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret missing"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build web + worker bundle
        run: |
          pnpm --filter @bike-ops/web build
          node scripts/build-worker-bundle.mjs
          # Prefer minified if present from local artifact path; otherwise use esbuild output
          if [ -f deploy-artifacts/worker.min.js ]; then
            cp deploy-artifacts/worker.min.js dist/worker/index.js
          fi
          ls -la dist/worker apps/web/dist | head
      - name: Deploy Worker with Static Assets via Wrangler
        run: |
          npm install -g wrangler@4
          # Write a temporary wrangler config pointing at bundled JS
          cat > wrangler.deploy.jsonc <<'JSON'
          {
            "name": "bike-ops-staging",
            "main": "dist/worker/index.js",
            "compatibility_date": "2026-07-17",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "assets": {
              "directory": "apps/web/dist",
              "not_found_handling": "single-page-application",
              "binding": "ASSETS",
              "run_worker_first": ["/api/*", "/health/*"]
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "bike-ops-staging",
                "database_id": "91e78387-9b24-4126-a5a1-27f9c1792975",
                "migrations_dir": "migrations/d1"
              }
            ],
            "vars": {
              "APP_ENV": "staging",
              "APP_VERSION": "5.3.2",
              "COOKIE_SECURE": "true",
              "SESSION_TTL_HOURS": "12",
              "CORS_ALLOWED_ORIGINS": "https://bike-ops-staging.geeklightonefish.workers.dev",
              "GIT_SHA": "${{ github.sha }}"
            }
          }
          JSON
          # Fix GIT_SHA properly
          node -e "
            const fs=require('fs');
            const p='wrangler.deploy.jsonc';
            let t=fs.readFileSync(p,'utf8');
            t=t.replace('\${{ github.sha }}', process.env.GITHUB_SHA);
            fs.writeFileSync(p,t);
          "
          wrangler deploy --config wrangler.deploy.jsonc
      - name: Smoke health
        run: |
          set -e
          BASE=https://bike-ops-staging.geeklightonefish.workers.dev
          curl -fsS "$BASE/health/live" | tee /tmp/live.json
          curl -fsS "$BASE/health/ready" | tee /tmp/ready.json
          curl -fsS "$BASE/api/v1/meta/version" | tee /tmp/meta.json
          grep -q '"status":"ok"' /tmp/live.json
          grep -q '"status":"ready"' /tmp/ready.json
