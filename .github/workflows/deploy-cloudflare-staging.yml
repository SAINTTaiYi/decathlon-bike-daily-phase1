name: Deploy Cloudflare staging · free stack

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA at the selected branch head
        required: true
        type: string
      confirm_free_plan:
        description: Confirm Cloudflare Workers and D1 remain on the Free plan
        required: true
        type: boolean
        default: false
      confirm_no_billing:
        description: Confirm paid plans, usage billing, and automatic upgrades are disabled
        required: true
        type: boolean
        default: false
      confirm_staging_only:
        description: Confirm this deploys Staging only and Production remains untouched
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/feature/cloudflare-workers-d1' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      SHIPHUB_BASE_URL: ${{ vars.SHIPHUB_BASE_URL }}
      SHIPHUB_OAUTH_TOKEN_URL: ${{ vars.SHIPHUB_OAUTH_TOKEN_URL }}
    steps:
      - name: Enforce Free, no-billing, Staging-only, and required credentials
        env:
          CONFIRM_FREE_PLAN: ${{ inputs.confirm_free_plan }}
          CONFIRM_NO_BILLING: ${{ inputs.confirm_no_billing }}
          CONFIRM_STAGING_ONLY: ${{ inputs.confirm_staging_only }}
        run: |
          set -euo pipefail
          test "$CONFIRM_FREE_PLAN" = true || { echo "::error::confirm_free_plan=true required"; exit 1; }
          test "$CONFIRM_NO_BILLING" = true || { echo "::error::confirm_no_billing=true required"; exit 1; }
          test "$CONFIRM_STAGING_ONLY" = true || { echo "::error::confirm_staging_only=true required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "02cb272ad6a5fd7e157a84061c8c5d42" || { echo "::error::unexpected Cloudflare account id"; exit 1; }
          test -n "$STAGING_BASE_URL" || { echo "::error::STAGING_BASE_URL variable missing"; exit 1; }
          case "$STAGING_BASE_URL" in
            https://*) ;;
            *) echo "::error::STAGING_BASE_URL must be an https URL"; exit 1 ;;
          esac
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify release SHA equals the selected remote branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full lowercase SHA"; exit 1; }
          BRANCH="${GITHUB_REF#refs/heads/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$RELEASE_SHA" = "$(git rev-parse "origin/$BRANCH")" || { echo "::error::release_sha must equal the remote branch head"; exit 1; }
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)" || { echo "::error::checkout does not match release_sha"; exit 1; }
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install frozen dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Record Preview source fingerprint without changing public version
        run: pnpm version:preview
      - name: Validate, test, typecheck, and build before Cloudflare deployment
        run: pnpm check:workflows && pnpm test && pnpm typecheck && pnpm build
      - name: Generate minified Worker bundle from the validated source
        run: |
          set -euo pipefail
          pnpm build:worker-bundle
          cp dist/worker/index.min.js dist/worker/index.js
          test -s dist/worker/index.js
          test -s apps/web/dist/index.html
      - name: Install pinned Wrangler through the network guard
        run: node scripts/ops/network-guard.mjs npm/pnpm npm install --global wrangler@4.112.0
      - name: Prepare the Staging Worker, Static Assets, and D1 configuration
        run: |
          set -euo pipefail
          cat > wrangler.deploy.jsonc <<'JSON'
          {
            "name": "bike-ops-staging",
            "main": "dist/worker/index.js",
            "compatibility_date": "2026-07-17",
            "compatibility_flags": ["nodejs_compat"],
            "placement": { "mode": "smart" },
            "workers_dev": true,
            "assets": {
              "directory": "apps/web/dist",
              "not_found_handling": "single-page-application",
              "binding": "ASSETS",
              "run_worker_first": true
            },
            "d1_databases": [{
              "binding": "DB",
              "database_name": "bike-ops-staging",
              "database_id": "91e78387-9b24-4126-a5a1-27f9c1792975",
              "migrations_dir": "migrations/d1"
            }],
            "triggers": {
              "crons": ["*/5 * * * *"]
            },
            "vars": {
              "APP_ENV": "staging",
              "APP_VERSION": "__APP_VERSION__",
              "COOKIE_SECURE": "true",
              "SESSION_TTL_HOURS": "12",
              "CORS_ALLOWED_ORIGINS": "__CORS_ALLOWED_ORIGINS__",
              "GIT_SHA": "__RELEASE_SHA__",
              "SHIPHUB_ENABLED": "true",
              "SHIPHUB_MODE": "live",
              "SHIPHUB_BASE_URL": "__SHIPHUB_BASE_URL__",
              "SHIPHUB_OAUTH_TOKEN_URL": "__SHIPHUB_OAUTH_TOKEN_URL__",
              "SHIPHUB_ACTIVE_START_HOUR": "10",
              "SHIPHUB_ACTIVE_END_HOUR": "22"
            }
          }
          JSON
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./package.json')
          const path = 'wrangler.deploy.jsonc'
          let text = fs.readFileSync(path, 'utf8')
          const origins = Array.from(new Set([
            process.env.STAGING_BASE_URL,
            'https://workshop.skin',
            'https://www.workshop.skin',
            'https://bike-ops-staging.geeklightonefish.workers.dev'
          ].filter(Boolean))).join(',')
          text = text.replace('__APP_VERSION__', pkg.version)
            .replace('__RELEASE_SHA__', process.env.RELEASE_SHA)
            .replace('__CORS_ALLOWED_ORIGINS__', origins)
            .replace('__SHIPHUB_BASE_URL__', process.env.SHIPHUB_BASE_URL)
            .replace('__SHIPHUB_OAUTH_TOKEN_URL__', process.env.SHIPHUB_OAUTH_TOKEN_URL)
          fs.writeFileSync(path, text)
          NODE
      - name: Apply Staging D1 migrations
        run: wrangler d1 migrations apply bike-ops-staging --remote --config wrangler.deploy.jsonc
      - name: Inject Shiphub secrets into the Staging Worker
        env:
          SHIPHUB_LOCATION_NUM: ${{ secrets.SHIPHUB_LOCATION_NUM }}
          SHIPHUB_OAUTH_BASIC_TOKEN: ${{ secrets.SHIPHUB_OAUTH_BASIC_TOKEN }}
          SHIPHUB_BOOTSTRAP_REFRESH_TOKEN: ${{ secrets.SHIPHUB_BOOTSTRAP_REFRESH_TOKEN }}
          SHIPHUB_TOKEN_ENCRYPTION_KEY: ${{ secrets.SHIPHUB_TOKEN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SHIPHUB_LOCATION_NUM" | wrangler secret put SHIPHUB_LOCATION_NUM --config wrangler.deploy.jsonc
          printf '%s' "$SHIPHUB_OAUTH_BASIC_TOKEN" | wrangler secret put SHIPHUB_OAUTH_BASIC_TOKEN --config wrangler.deploy.jsonc
          printf '%s' "$SHIPHUB_BOOTSTRAP_REFRESH_TOKEN" | wrangler secret put SHIPHUB_BOOTSTRAP_REFRESH_TOKEN --config wrangler.deploy.jsonc
          printf '%s' "$SHIPHUB_TOKEN_ENCRYPTION_KEY" | wrangler secret put SHIPHUB_TOKEN_ENCRYPTION_KEY --config wrangler.deploy.jsonc
      - name: Deploy the Staging Worker with Static Assets and D1
        run: wrangler deploy --config wrangler.deploy.jsonc
      - name: Verify the deployed Staging API, release identity, and Web shell
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 24); do
            curl -fsS "$STAGING_BASE_URL/health/live" | tee /tmp/live.json >/dev/null
            curl -fsS "$STAGING_BASE_URL/health/ready" | tee /tmp/ready.json >/dev/null
            curl -fsS "$STAGING_BASE_URL/api/v1/meta/version" | tee /tmp/meta.json >/dev/null
            curl -fsS "$STAGING_BASE_URL/" | tee /tmp/index.html >/dev/null
            if grep -q '"status":"ok"' /tmp/live.json \
              && grep -q '"status":"ready"' /tmp/ready.json \
              && grep -Fq "\"appVersion\":\"$APP_VERSION\"" /tmp/meta.json \
              && grep -Fq "\"gitSha\":\"$RELEASE_SHA\"" /tmp/live.json \
              && grep -Fq "\"environment\":\"staging\"" /tmp/meta.json \
              && grep -qi '<!doctype html' /tmp/index.html; then
              echo "Staging identity matched on attempt $attempt"
              cat /tmp/live.json; echo
              cat /tmp/ready.json; echo
              cat /tmp/meta.json; echo
              exit 0
            fi
            echo "attempt $attempt: waiting for Staging identity to converge"
            sleep 5
          done
          echo "::error::Staging identity did not converge to $APP_VERSION / $RELEASE_SHA"
          exit 1
