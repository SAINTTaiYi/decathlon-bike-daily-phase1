name: Deploy Cloudflare staging · free stack

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA at the selected Staging branch head
        required: true
        type: string
      confirm_free_plan:
        description: Confirm Cloudflare Workers and D1 remain on the Free plan
        required: true
        type: boolean
        default: false
      confirm_no_billing:
        description: Confirm paid plans, usage billing, and automatic upgrades are disabled
        required: true
        type: boolean
        default: false
      confirm_staging_only:
        description: Confirm this deploys Staging only and Production remains forbidden
        required: true
        type: boolean
        default: false
  # Optional direct path: only the migration feature branch or develop may auto-deploy after CI succeeds.
  # Disabled by default until the first manual deploy with GitHub Secrets proves the token path.
  # push:
  #   branches: [feature/cloudflare-workers-d1, develop]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/feature/cloudflare-workers-d1' || github.ref == 'refs/heads/develop'
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: Enforce Free, no-billing, Staging-only, and required credentials
        env:
          CONFIRM_FREE_PLAN: ${{ inputs.confirm_free_plan }}
          CONFIRM_NO_BILLING: ${{ inputs.confirm_no_billing }}
          CONFIRM_STAGING_ONLY: ${{ inputs.confirm_staging_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRM_FREE_PLAN" = true || { echo "::error::confirm_free_plan=true required"; exit 1; }
            test "$CONFIRM_NO_BILLING" = true || { echo "::error::confirm_no_billing=true required"; exit 1; }
            test "$CONFIRM_STAGING_ONLY" = true || { echo "::error::confirm_staging_only=true required"; exit 1; }
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID variable missing"; exit 1; }
          test -n "$STAGING_BASE_URL" || { echo "::error::STAGING_BASE_URL variable missing"; exit 1; }
          case "$STAGING_BASE_URL" in
            https://*) ;;
            *) echo "::error::STAGING_BASE_URL must be an https URL"; exit 1 ;;
          esac
          test "$CLOUDFLARE_ACCOUNT_ID" = "02cb272ad6a5fd7e157a84061c8c5d42" || { echo "::error::unexpected Cloudflare account id"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify release SHA equals the selected remote Staging branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full lowercase SHA"; exit 1; }
          BRANCH="${GITHUB_REF#refs/heads/}"
          # checkout uses persist-credentials=false; re-authenticate only for this read-only head verification.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          REMOTE_SHA="$(git rev-parse "origin/$BRANCH")"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$REMOTE_SHA" || { echo "::error::release_sha must equal the remote $BRANCH head"; exit 1; }
          test "$RELEASE_SHA" = "$CHECKED_OUT_SHA" || { echo "::error::checkout does not match release_sha"; exit 1; }
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install frozen dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Validate, test, typecheck, and build before Cloudflare deployment
        run: pnpm check:workflows && pnpm test && pnpm typecheck && pnpm build
      - name: Generate minified Worker bundle from the validated source
        run: |
          pnpm build:worker-bundle
          cp dist/worker/index.min.js dist/worker/index.js
          test -s dist/worker/index.js
          test -s apps/web/dist/index.html
      - name: Install pinned Wrangler through the network guard
        run: node scripts/ops/network-guard.mjs npm/pnpm npm install --global wrangler@4.112.0
      - name: Prepare the Staging Worker, Static Assets, and D1 configuration
        run: |
          cat > wrangler.deploy.jsonc <<'JSON'
          {
            "name": "bike-ops-staging",
            "main": "dist/worker/index.js",
            "compatibility_date": "2026-07-17",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "assets": {
              "directory": "apps/web/dist",
              "not_found_handling": "single-page-application",
              "binding": "ASSETS",
              "run_worker_first": ["/api/*", "/health/*"]
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "bike-ops-staging",
                "database_id": "91e78387-9b24-4126-a5a1-27f9c1792975",
                "migrations_dir": "migrations/d1"
              }
            ],
            "vars": {
              "APP_ENV": "staging",
              "APP_VERSION": "__APP_VERSION__",
              "COOKIE_SECURE": "true",
              "SESSION_TTL_HOURS": "12",
              "CORS_ALLOWED_ORIGINS": "__STAGING_BASE_URL__",
              "GIT_SHA": "__RELEASE_SHA__"
            }
          }
          JSON
          node -e "
            const fs=require('fs');
            const pkg=require('./package.json');
            const p='wrangler.deploy.jsonc';
            let t=fs.readFileSync(p,'utf8');
            t=t
              .replace('__APP_VERSION__', pkg.version)
              .replace('__RELEASE_SHA__', process.env.RELEASE_SHA)
              .replace('__STAGING_BASE_URL__', process.env.STAGING_BASE_URL);
            fs.writeFileSync(p,t);
          "
      - name: Deploy the Staging Worker with Static Assets and D1
        run: wrangler deploy --config wrangler.deploy.jsonc
      - name: Verify the deployed Staging API, release identity, and Web shell
        run: |
          set -euo pipefail
          BASE="$STAGING_BASE_URL"
          APP_VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 24); do
            curl -fsS "$BASE/health/live" | tee /tmp/live.json >/dev/null
            curl -fsS "$BASE/health/ready" | tee /tmp/ready.json >/dev/null
            curl -fsS "$BASE/api/v1/meta/version" | tee /tmp/meta.json >/dev/null
            curl -fsS "$BASE/" | tee /tmp/index.html >/dev/null
            if grep -q '"status":"ok"' /tmp/live.json \
              && grep -q '"status":"ready"' /tmp/ready.json \
              && grep -Fq "\"appVersion\":\"$APP_VERSION\"" /tmp/meta.json \
              && grep -Fq "\"gitSha\":\"$RELEASE_SHA\"" /tmp/meta.json \
              && grep -Fq "\"version\":\"$APP_VERSION\"" /tmp/live.json \
              && grep -Fq "\"version\":\"$APP_VERSION\"" /tmp/ready.json \
              && grep -qi '<!doctype html' /tmp/index.html; then
              echo "Staging identity matched on attempt $attempt"
              cat /tmp/live.json; echo
              cat /tmp/ready.json; echo
              cat /tmp/meta.json; echo
              exit 0
            fi
            echo "attempt $attempt: waiting for Staging identity to converge"
            cat /tmp/live.json; echo
            cat /tmp/ready.json; echo
            cat /tmp/meta.json; echo
            sleep 5
          done
          echo "::error::Staging identity did not converge to $APP_VERSION / $RELEASE_SHA"
          exit 1
