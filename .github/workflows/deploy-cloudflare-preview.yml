name: Deploy Cloudflare preview · free stack

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA at the selected Preview branch head
        required: true
        type: string
      confirm_free_plan:
        description: Confirm Cloudflare Workers and D1 remain on the Free plan
        required: true
        type: boolean
        default: false
      confirm_no_billing:
        description: Confirm paid plans, usage billing, and automatic upgrades are disabled
        required: true
        type: boolean
        default: false
      confirm_preview_only:
        description: Confirm this deploys Preview only; Staging and Production remain untouched
        required: true
        type: boolean
        default: false
      seed_preview_data:
        description: Also inject deterministic admin-console acceptance data into the Preview D1 (scripts/ops/seed-preview-admin.mjs)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    if: true
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
    steps:
      - name: Enforce Free, no-billing, Preview-only, and required credentials
        env:
          CONFIRM_FREE_PLAN: ${{ inputs.confirm_free_plan }}
          CONFIRM_NO_BILLING: ${{ inputs.confirm_no_billing }}
          CONFIRM_PREVIEW_ONLY: ${{ inputs.confirm_preview_only }}
        run: |
          test "$CONFIRM_FREE_PLAN" = true || { echo "::error::confirm_free_plan=true required"; exit 1; }
          test "$CONFIRM_NO_BILLING" = true || { echo "::error::confirm_no_billing=true required"; exit 1; }
          test "$CONFIRM_PREVIEW_ONLY" = true || { echo "::error::confirm_preview_only=true required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID variable missing"; exit 1; }
          test -n "$PREVIEW_BASE_URL" || { echo "::error::PREVIEW_BASE_URL variable missing"; exit 1; }
          case "$PREVIEW_BASE_URL" in
            https://*) ;;
            *) echo "::error::PREVIEW_BASE_URL must be an https URL"; exit 1 ;;
          esac
          test "$CLOUDFLARE_ACCOUNT_ID" = "02cb272ad6a5fd7e157a84061c8c5d42" || { echo "::error::unexpected Cloudflare account id"; exit 1; }
          case "$PREVIEW_BASE_URL" in
            *production*) echo "::error::Preview URL must not point at production"; exit 1 ;;
          esac
          if [[ "$PREVIEW_BASE_URL" != *"bike-ops-preview"* ]]; then
            echo "::error::Preview URL must target the bike-ops-preview host"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify release SHA equals the selected remote Preview branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full lowercase SHA"; exit 1; }
          BRANCH="${GITHUB_REF#refs/heads/}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          REMOTE_SHA="$(git rev-parse "origin/$BRANCH")"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$REMOTE_SHA" || { echo "::error::release_sha must equal the remote $BRANCH head"; exit 1; }
          test "$RELEASE_SHA" = "$CHECKED_OUT_SHA" || { echo "::error::checkout does not match release_sha"; exit 1; }
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install frozen dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Record Preview source fingerprint without changing public version
        run: pnpm version:preview
      - name: Validate, test, typecheck, and build before Cloudflare Preview deployment
        run: pnpm check:workflows && pnpm test && pnpm typecheck && pnpm build
      - name: Generate minified Worker bundle from the validated source
        run: |
          pnpm build:worker-bundle
          cp dist/worker/index.min.js dist/worker/index.js
          test -s dist/worker/index.js
          test -s apps/web/dist/index.html
      - name: Install pinned Wrangler through the network guard
        run: node scripts/ops/network-guard.mjs npm/pnpm npm install --global wrangler@4.112.0
      - name: Prepare the Preview Worker, Static Assets, and D1 configuration
        run: |
          # 2026-09-12：Preview 不得注册任何 cron（preview 环境不得有自动化 D1 调用；
          # 定时同步只服务已配置本店账号的门店，preview 没有此类门店）。
          # 事故参考：fixture 定时同步曾对 12 家占位店每分钟写入，单日烧穿 D1 写配额。
          cat > wrangler.preview.jsonc <<'JSON'
          {
            "name": "bike-ops-preview",
            "main": "dist/worker/index.js",
            "compatibility_date": "2026-07-17",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "assets": {
              "directory": "apps/web/dist",
              "not_found_handling": "single-page-application",
              "binding": "ASSETS",
              "run_worker_first": true
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "bike-ops-preview",
                "database_id": "e40af8eb-6340-4b9e-8484-20247323fd84",
                "migrations_dir": "migrations/d1"
              }
            ],
            "durable_objects": {
              "bindings": [{ "name": "DESIGN_ROOM", "class_name": "DesignRoom" }]
            },
            "migrations": [{ "tag": "v1", "new_sqlite_classes": ["DesignRoom"] }],
            "vars": {
              "APP_ENV": "preview",
              "APP_VERSION": "__APP_VERSION__",
              "COOKIE_SECURE": "true",
              "SESSION_TTL_HOURS": "12",
              "CORS_ALLOWED_ORIGINS": "__PREVIEW_BASE_URL__",
              "GIT_SHA": "__RELEASE_SHA__",
              "SHIPHUB_ENABLED": "true",
              "SHIPHUB_MODE": "fixture",
              "SHIPHUB_ACTIVE_START_HOUR": "10",
              "SHIPHUB_ACTIVE_END_HOUR": "22",
            }
          }
          JSON
          node -e "
            const fs=require('fs');
            const pkg=require('./package.json');
            const p='wrangler.preview.jsonc';
            let t=fs.readFileSync(p,'utf8');
            t=t
              .replace('__APP_VERSION__', pkg.version)
              .replace('__RELEASE_SHA__', process.env.RELEASE_SHA)
              .replace('__PREVIEW_BASE_URL__', process.env.PREVIEW_BASE_URL);
            fs.writeFileSync(p,t);
          "
      - name: Apply Preview D1 migrations
        run: wrangler d1 migrations apply bike-ops-preview --remote --config wrangler.preview.jsonc
      - name: Remove live Shiphub secrets from the Preview Worker
        run: |
          set -euo pipefail
          for secret in SHIPHUB_LOCATION_NUM SHIPHUB_OAUTH_BASIC_TOKEN SHIPHUB_BOOTSTRAP_REFRESH_TOKEN SHIPHUB_TOKEN_ENCRYPTION_KEY ADMIN_SETUP_TOKEN_HASH; do
            wrangler secret delete "$secret" --config wrangler.preview.jsonc || true
          done
      - name: Inject BI masterdata + perfeco secrets into the Preview Worker
        env:
          BI_MASTERDATA_CLIENT_ID: ${{ secrets.BI_MASTERDATA_CLIENT_ID }}
          BI_MASTERDATA_CLIENT_SECRET: ${{ secrets.BI_MASTERDATA_CLIENT_SECRET }}
          BI_MASTERDATA_API_KEY: ${{ secrets.BI_MASTERDATA_API_KEY }}
          BI_MASTERDATA_LOGIN_KEY: ${{ secrets.BI_MASTERDATA_LOGIN_KEY }}
          BI_MASTERDATA_LOGIN_USERNAME_ENC: ${{ secrets.BI_MASTERDATA_LOGIN_USERNAME_ENC }}
          BI_MASTERDATA_LOGIN_PASSWORD_ENC: ${{ secrets.BI_MASTERDATA_LOGIN_PASSWORD_ENC }}
          BI_PERFECO_API_KEY: ${{ secrets.BI_PERFECO_API_KEY }}
          BI_SPD_API_KEY: ${{ secrets.BI_SPD_API_KEY }}
        run: |
          set -euo pipefail
          # 可选凭据：缺失时 BI 整车同步优雅跳过（available:false），不阻塞部署。
          if [ -n "$BI_MASTERDATA_CLIENT_ID" ] && [ -n "$BI_MASTERDATA_CLIENT_SECRET" ] && [ -n "$BI_MASTERDATA_API_KEY" ] && [ -n "$BI_MASTERDATA_LOGIN_KEY" ] && [ -n "$BI_MASTERDATA_LOGIN_USERNAME_ENC" ] && [ -n "$BI_MASTERDATA_LOGIN_PASSWORD_ENC" ] && [ -n "$BI_PERFECO_API_KEY" ] && [ -n "$BI_SPD_API_KEY" ]; then
            printf '%s' "$BI_MASTERDATA_CLIENT_ID" | wrangler secret put BI_MASTERDATA_CLIENT_ID --config wrangler.preview.jsonc
            printf '%s' "$BI_MASTERDATA_CLIENT_SECRET" | wrangler secret put BI_MASTERDATA_CLIENT_SECRET --config wrangler.preview.jsonc
            printf '%s' "$BI_MASTERDATA_API_KEY" | wrangler secret put BI_MASTERDATA_API_KEY --config wrangler.preview.jsonc
            printf '%s' "$BI_MASTERDATA_LOGIN_KEY" | wrangler secret put BI_MASTERDATA_LOGIN_KEY --config wrangler.preview.jsonc
            printf '%s' "$BI_MASTERDATA_LOGIN_USERNAME_ENC" | wrangler secret put BI_MASTERDATA_LOGIN_USERNAME_ENC --config wrangler.preview.jsonc
            printf '%s' "$BI_MASTERDATA_LOGIN_PASSWORD_ENC" | wrangler secret put BI_MASTERDATA_LOGIN_PASSWORD_ENC --config wrangler.preview.jsonc
            printf '%s' "$BI_PERFECO_API_KEY" | wrangler secret put BI_PERFECO_API_KEY --config wrangler.preview.jsonc
            printf '%s' "$BI_SPD_API_KEY" | wrangler secret put BI_SPD_API_KEY --config wrangler.preview.jsonc
          fi
      - name: Inject D1 metrics read token into the Preview Worker
        env:
          D1_METRICS_TOKEN: ${{ secrets.D1_METRICS_TOKEN }}
        run: |
          set -euo pipefail
          # 可选凭据：缺失时 D1 监控卡片优雅隐藏（available:false），不阻塞部署。
          if [ -n "$D1_METRICS_TOKEN" ]; then
            printf '%s' "$D1_METRICS_TOKEN" | wrangler secret put D1_METRICS_TOKEN --config wrangler.preview.jsonc
          fi
      - name: Deploy the Preview Worker with Static Assets and D1
        run: wrangler deploy --config wrangler.preview.jsonc
      - name: Verify the deployed Preview API, release identity, and Web shell
        run: |
          set -euo pipefail
          BASE="$PREVIEW_BASE_URL"
          APP_VERSION="$(node -p "require('./package.json').version")"
          # Edge may briefly serve the previous isolate; poll until identity matches this release.
          for attempt in $(seq 1 24); do
            curl -fsS "$BASE/health/live" | tee /tmp/live.json >/dev/null
            curl -fsS "$BASE/health/ready" | tee /tmp/ready.json >/dev/null
            curl -fsS "$BASE/api/v1/meta/version" | tee /tmp/meta.json >/dev/null
            curl -fsS "$BASE/" | tee /tmp/index.html >/dev/null
            if grep -q '"status":"ok"' /tmp/live.json \
              && grep -q '"status":"ready"' /tmp/ready.json \
              && grep -Fq "\"appVersion\":\"$APP_VERSION\"" /tmp/meta.json \
              && grep -Fq "\"gitSha\":\"$RELEASE_SHA\"" /tmp/live.json \
              && grep -Fq "\"gitSha\":\"$RELEASE_SHA\"" /tmp/ready.json \
              && grep -Fq "\"version\":\"$APP_VERSION\"" /tmp/live.json \
              && grep -Fq "\"version\":\"$APP_VERSION\"" /tmp/ready.json \
              && grep -qi '<!doctype html' /tmp/index.html; then
              echo "Preview identity matched on attempt $attempt"
              cat /tmp/live.json; echo
              cat /tmp/ready.json; echo
              cat /tmp/meta.json; echo
              exit 0
            fi
            echo "attempt $attempt: waiting for Preview identity to converge"
            cat /tmp/live.json; echo
            cat /tmp/ready.json; echo
            cat /tmp/meta.json; echo
            sleep 5
          done
          echo "::error::Preview identity did not converge to $APP_VERSION / $RELEASE_SHA"
          exit 1
      - name: Smoke the realtime design WebSocket (multi-client sync)
        # 门店设计实时协作（2026-09-17）：验证 WS 端点全链路 ——
        # 未登录被拒 / 登录 / hello 对账 / 增量广播 / 在线名单。
        # 未配置冒烟账号时跳过（其他环境不会因此失败）。
        env:
          PREVIEW_SMOKE_USERNAME: ${{ secrets.PREVIEW_SMOKE_USERNAME }}
          PREVIEW_SMOKE_PASSWORD: ${{ secrets.PREVIEW_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_SMOKE_USERNAME:-}" ] || [ -z "${PREVIEW_SMOKE_PASSWORD:-}" ]; then
            echo "::warning::PREVIEW_SMOKE_USERNAME/PASSWORD 未配置，跳过实时协作冒烟"
            exit 0
          fi
          mkdir -p /tmp/ws-smoke
          node scripts/ops/network-guard.mjs npm/registry npm install --prefix /tmp/ws-smoke ws@8 yjs@13 --silent --no-fund --no-audit
          SMOKE_BASE_URL="$PREVIEW_BASE_URL" SMOKE_USERNAME="$PREVIEW_SMOKE_USERNAME" SMOKE_PASSWORD="$PREVIEW_SMOKE_PASSWORD" node scripts/ops/ws-smoke.mjs
      - name: Smoke the design tool in a real browser (client load + live connection)
        # 客户端侧冒烟：真实 Chrome 加载工具页 → SDCollab online → 在线胶囊 → 双端名单。
        # 2026-09-17 起为硬失败门禁（首轮观测已通过：加载/连接/胶囊/双端名单全绿）。
        env:
          PREVIEW_SMOKE_USERNAME: ${{ secrets.PREVIEW_SMOKE_USERNAME }}
          PREVIEW_SMOKE_PASSWORD: ${{ secrets.PREVIEW_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_SMOKE_USERNAME:-}" ] || [ -z "${PREVIEW_SMOKE_PASSWORD:-}" ]; then
            echo "::warning::PREVIEW_SMOKE_USERNAME/PASSWORD 未配置，跳过浏览器冒烟"
            exit 0
          fi
          node scripts/ops/network-guard.mjs npm/registry npm install --prefix /tmp/ws-smoke puppeteer-core@23 --silent --no-fund --no-audit
          SMOKE_BASE_URL="$PREVIEW_BASE_URL" SMOKE_USERNAME="$PREVIEW_SMOKE_USERNAME" SMOKE_PASSWORD="$PREVIEW_SMOKE_PASSWORD" node scripts/ops/browser-smoke.mjs
      - name: Smoke the update announcement dialog in a real browser (no remount twitch)
        # 2026-09-18「弹窗抽搐」修复的门禁：公告弹窗在登录后启动链路里必须是同一个 DOM
        # 节点、入场动画只播一次。修复前 App 的每个早期 return 分支各挂一份弹窗，
        # 分支切换（验证会话 → 引导页 → 工作台）会卸载重建，补间重播 = 用户看到的抽搐。
        env:
          PREVIEW_SMOKE_USERNAME: ${{ secrets.PREVIEW_SMOKE_USERNAME }}
          PREVIEW_SMOKE_PASSWORD: ${{ secrets.PREVIEW_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_SMOKE_USERNAME:-}" ] || [ -z "${PREVIEW_SMOKE_PASSWORD:-}" ]; then
            echo "::warning::PREVIEW_SMOKE_USERNAME/PASSWORD 未配置，跳过公告弹窗冒烟"
            exit 0
          fi
          node scripts/ops/network-guard.mjs npm/registry npm install --prefix /tmp/ws-smoke puppeteer-core@23 --silent --no-fund --no-audit
          SMOKE_BASE_URL="$PREVIEW_BASE_URL" SMOKE_USERNAME="$PREVIEW_SMOKE_USERNAME" SMOKE_PASSWORD="$PREVIEW_SMOKE_PASSWORD" node scripts/ops/announcement-smoke.mjs
      - name: Seed admin-console acceptance data (opt-in, Preview D1 only)
        if: ${{ inputs.seed_preview_data }}
        run: |
          node scripts/ops/seed-preview-admin.mjs > /tmp/seed-preview.sql
          test -s /tmp/seed-preview.sql
          wrangler d1 execute bike-ops-preview --remote --config wrangler.preview.jsonc --file=/tmp/seed-preview.sql
          for i in 1 2 3; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "$PREVIEW_BASE_URL/health/live?cb=$i")" = "200" || { echo "::error::preview /health/live failed after seed"; exit 1; }
            test "$(curl -sS -o /dev/null -w '%{http_code}' "$PREVIEW_BASE_URL/health/ready?cb=$i")" = "200" || { echo "::error::preview /health/ready failed after seed"; exit 1; }
          done
          echo "Preview acceptance data seeded"
