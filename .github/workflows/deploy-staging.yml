name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.state.outputs.ready }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Check whether staging has been bootstrapped
        id: state
        shell: bash
        run: |
          if test -s infra/state/staging.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging infrastructure is not bootstrapped yet; deployment is skipped safely."
          fi

  deploy:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SUPABASE_DB_PASSWORD_STAGING: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Enforce develop branch
        run: |
          test "$GITHUB_REF" = refs/heads/develop || {
            echo "::error::Staging releases must run from develop."
            exit 1
          }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Export release identity
        run: |
          app_version=$(node -p "require('./package.json').version")
          printf 'APP_VERSION=%s\n' "$app_version" >> "$GITHUB_ENV"
          printf 'GIT_SHA=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Verify committed staging state
        run: test -s infra/state/staging.json
      - name: Validate workflow policy
        run: pnpm check:workflows
      - name: Test, typecheck, and build
        run: pnpm test && pnpm typecheck && pnpm build
      - name: Preflight release credentials
        run: pnpm ops preflight staging --release
      - name: Release in safe order
        run: pnpm ops release staging
      - name: Verify deployed API and web
        run: pnpm ops verify staging
      - name: Preserve staging release state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-state-staging-${{ github.run_id }}
          path: infra/state/staging.json
          if-no-files-found: error
          retention-days: 30
