name: Deploy staging · free stack

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current develop commit SHA to migrate and deploy
        required: true
        type: string
      confirm_free_plan:
        description: Confirm Supabase and EdgeOne projects are on free plans
        required: true
        type: boolean
        default: false
      confirm_no_billing:
        description: Confirm paid plans, usage-based billing, and automatic upgrades are disabled
        required: true
        type: boolean
        default: false
      confirm_staging_only:
        description: Confirm this run changes Staging only and Production remains forbidden
        required: true
        type: boolean
        default: false
      database_only_bootstrap:
        description: Apply migrations only before the first EdgeOne project import; do not push or verify deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-staging-free-stack
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
    steps:
      - name: Enforce develop and free-tier confirmations
        env:
          CONFIRM_FREE_PLAN: ${{ inputs.confirm_free_plan }}
          CONFIRM_NO_BILLING: ${{ inputs.confirm_no_billing }}
          CONFIRM_STAGING_ONLY: ${{ inputs.confirm_staging_only }}
        run: |
          test "$GITHUB_REF" = refs/heads/develop || {
            echo "::error::Staging deployment must be dispatched from develop."
            exit 1
          }
          test "$CONFIRM_FREE_PLAN" = true || {
            echo "::error::confirm_free_plan=true is required."
            exit 1
          }
          test "$CONFIRM_NO_BILLING" = true || {
            echo "::error::confirm_no_billing=true is required."
            exit 1
          }
          test "$CONFIRM_STAGING_ONLY" = true || {
            echo "::error::confirm_staging_only=true is required."
            exit 1
          }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify immutable Staging source and deployment branch
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release_sha must be a full 40-character lowercase commit SHA."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "::error::Checked-out SHA differs from release_sha."
            exit 1
          }
          node scripts/ops/network-guard.mjs GitHub git fetch --no-tags origin \
            develop:refs/remotes/origin/develop
          test "$(git rev-parse origin/develop)" = "$EXPECTED_SHA" || {
            echo "::error::release_sha is not the current remote develop HEAD."
            exit 1
          }
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Validate, test, typecheck, and build before database mutation
        run: pnpm check:workflows && pnpm test && pnpm typecheck && pnpm build
      - name: Validate Staging migration credential and deployment URL
        env:
          DATABASE_ONLY_BOOTSTRAP: ${{ inputs.database_only_bootstrap }}
        run: |
          test -n "$MIGRATION_DATABASE_URL" || {
            echo "::error::MIGRATION_DATABASE_URL is not configured in the staging GitHub Environment."
            exit 1
          }
          if [ "$DATABASE_ONLY_BOOTSTRAP" != true ]; then
            test -n "$EDGEONE_SITE_URL" || {
              echo "::error::EDGEONE_SITE_URL is not configured in the staging GitHub Environment."
              exit 1
            }
            node -e "const u=new URL(process.env.EDGEONE_SITE_URL); if(u.protocol!=='https:') throw new Error('EDGEONE_SITE_URL must use HTTPS')"
          fi
      - name: Apply checksum-locked Supabase migrations
        run: node scripts/ops/network-guard.mjs Supabase pnpm --filter @bike-ops/database migrate
      - name: Fast-forward the EdgeOne Staging deployment branch
        if: inputs.database_only_bootstrap == false
        run: node scripts/ops/network-guard.mjs GitHub node scripts/ops/promote-branch.mjs "${{ inputs.release_sha }}" edgeone-staging
      - name: Verify the deployed SHA, environment, API, database, and Web
        if: inputs.database_only_bootstrap == false
        run: node scripts/ops/verify-deployment.mjs "$EDGEONE_SITE_URL" "${{ inputs.release_sha }}" staging | tee staging-deployment-receipt.json
      - name: Preserve non-sensitive Staging deployment receipt
        if: inputs.database_only_bootstrap == false && always() && hashFiles('staging-deployment-receipt.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-free-stack-${{ inputs.release_sha }}
          path: staging-deployment-receipt.json
          if-no-files-found: error
          retention-days: 30
