name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SUPABASE_DB_PASSWORD_STAGING: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Enforce develop branch
        run: |
          test "$GITHUB_REF" = refs/heads/develop || {
            echo "::error::Staging releases must run from develop."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Export release identity
        run: |
          echo "APP_VERSION=$(node -p \"require('./package.json').version\")" >> "$GITHUB_ENV"
          echo "GIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Verify committed staging state
        run: test -s infra/state/staging.json
      - name: Validate workflow policy
        run: pnpm check:workflows
      - name: Test, typecheck, and build
        run: pnpm test && pnpm typecheck && pnpm build
      - name: Preflight release credentials
        run: pnpm ops preflight staging --release
      - name: Release in safe order
        run: pnpm ops release staging
      - name: Verify deployed API and web
        run: pnpm ops verify staging
      - name: Preserve staging release state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-state-staging-${{ github.run_id }}
          path: infra/state/staging.json
          if-no-files-found: error
          retention-days: 30
