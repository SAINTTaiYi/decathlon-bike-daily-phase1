name: Deploy production · free stack

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to release
        required: true
        type: string
      release_sha:
        description: Exact current main commit SHA to release
        required: true
        type: string
      staging_accepted_sha:
        description: Exact SHA currently deployed and accepted on Staging
        required: true
        type: string
      approve_production:
        description: Explicitly approve the Production release
        required: true
        type: boolean
        default: false
      confirm_encrypted_backup:
        description: Confirm a current encrypted export exists outside Supabase
        required: true
        type: boolean
        default: false
      confirm_restore_drill:
        description: Confirm the encrypted export has passed a restore drill
        required: true
        type: boolean
        default: false
      confirm_free_plan:
        description: Confirm Supabase and EdgeOne Production projects are on free plans
        required: true
        type: boolean
        default: false
      confirm_no_billing:
        description: Confirm paid plans, usage-based billing, and automatic upgrades are disabled
        required: true
        type: boolean
        default: false
      database_only_bootstrap:
        description: Apply migrations only before the first EdgeOne Production project import
        required: true
        type: boolean
        default: false
      confirm_aggregated_preview_announcement:
        description: Confirm the accepted Preview cycle was aggregated into the formal public update announcement and version bump
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-production-free-stack
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      EDGEONE_SITE_URL: ${{ vars.EDGEONE_SITE_URL }}
    steps:
      - name: Enforce main and Production approvals
        env:
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
          CONFIRM_ENCRYPTED_BACKUP: ${{ inputs.confirm_encrypted_backup }}
          CONFIRM_RESTORE_DRILL: ${{ inputs.confirm_restore_drill }}
          CONFIRM_FREE_PLAN: ${{ inputs.confirm_free_plan }}
          CONFIRM_NO_BILLING: ${{ inputs.confirm_no_billing }}
          CONFIRM_AGGREGATED_PREVIEW_ANNOUNCEMENT: ${{ inputs.confirm_aggregated_preview_announcement }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::Production deployment must be dispatched from main."
            exit 1
          }
          test "$APPROVE_PRODUCTION" = true || { echo "::error::approve_production=true is required."; exit 1; }
          test "$CONFIRM_ENCRYPTED_BACKUP" = true || { echo "::error::confirm_encrypted_backup=true is required."; exit 1; }
          test "$CONFIRM_RESTORE_DRILL" = true || { echo "::error::confirm_restore_drill=true is required."; exit 1; }
          test "$CONFIRM_FREE_PLAN" = true || { echo "::error::confirm_free_plan=true is required."; exit 1; }
          test "$CONFIRM_NO_BILLING" = true || { echo "::error::confirm_no_billing=true is required."; exit 1; }
          test "$CONFIRM_AGGREGATED_PREVIEW_ANNOUNCEMENT" = true || { echo "::error::confirm_aggregated_preview_announcement=true is required."; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify immutable Production identity and accepted Staging source
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.release_sha }}
          STAGING_ACCEPTED_SHA: ${{ inputs.staging_accepted_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full SHA."; exit 1; }
          [[ "$STAGING_ACCEPTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::staging_accepted_sha must be a full SHA."; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "::error::Checked-out SHA differs from release_sha."; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION" || { echo "::error::Requested version does not match package.json."; exit 1; }
          node scripts/ops/network-guard.mjs GitHub git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            develop:refs/remotes/origin/develop \
            edgeone-staging:refs/remotes/origin/edgeone-staging
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || { echo "::error::release_sha is not current remote main."; exit 1; }
          test "$(git rev-parse origin/edgeone-staging)" = "$STAGING_ACCEPTED_SHA" || { echo "::error::Accepted SHA is not the current EdgeOne Staging deployment."; exit 1; }
          git merge-base --is-ancestor "$STAGING_ACCEPTED_SHA" "$EXPECTED_SHA" || { echo "::error::Accepted Staging SHA is not an ancestor of Production."; exit 1; }
          git diff --quiet "$STAGING_ACCEPTED_SHA" "$EXPECTED_SHA" -- . || { echo "::error::Production source differs from accepted Staging source."; exit 1; }
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Verify formal Preview-cycle announcement and public version
        run: pnpm check:version -- --mode production
      - name: Validate, test, typecheck, and build before database mutation
        run: pnpm check:workflows && pnpm test && pnpm typecheck && pnpm build
      - name: Validate Production migration credential and deployment URL
        env:
          DATABASE_ONLY_BOOTSTRAP: ${{ inputs.database_only_bootstrap }}
        run: |
          test -n "$MIGRATION_DATABASE_URL" || { echo "::error::MIGRATION_DATABASE_URL is missing."; exit 1; }
          if [ "$DATABASE_ONLY_BOOTSTRAP" != true ]; then
            test -n "$EDGEONE_SITE_URL" || { echo "::error::EDGEONE_SITE_URL is missing."; exit 1; }
            node -e "const u=new URL(process.env.EDGEONE_SITE_URL); if(u.protocol!=='https:') throw new Error('EDGEONE_SITE_URL must use HTTPS')"
          fi
      - name: Apply checksum-locked Supabase migrations
        run: node scripts/ops/network-guard.mjs Supabase pnpm --filter @bike-ops/database migrate
      - name: Fast-forward the EdgeOne Production deployment branch
        if: inputs.database_only_bootstrap == false
        run: node scripts/ops/network-guard.mjs GitHub node scripts/ops/promote-branch.mjs "${{ inputs.release_sha }}" edgeone-production
      - name: Verify the deployed SHA, environment, API, database, and Web
        if: inputs.database_only_bootstrap == false
        run: node scripts/ops/verify-deployment.mjs "$EDGEONE_SITE_URL" "${{ inputs.release_sha }}" production | tee production-deployment-receipt.json
      - name: Preserve non-sensitive Production deployment receipt
        if: inputs.database_only_bootstrap == false && always() && hashFiles('production-deployment-receipt.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-free-stack-${{ inputs.release_sha }}
          path: production-deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
