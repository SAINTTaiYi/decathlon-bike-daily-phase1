name: Deploy production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to release
        required: true
        type: string
      release_sha:
        description: Exact main commit SHA to release
        required: true
        type: string
      staging_accepted_sha:
        description: Exact staging commit SHA accepted by the user
        required: true
        type: string
      approve_production:
        description: Explicitly approve the production release
        required: true
        type: boolean
        default: false
      confirm_backup:
        description: Confirm a current Supabase backup or recovery point exists
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SUPABASE_DB_PASSWORD_PRODUCTION: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Enforce main, approval, and backup gates
        env:
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
          CONFIRM_BACKUP: ${{ inputs.confirm_backup }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::Production releases must be dispatched from main."
            exit 1
          }
          test "$APPROVE_PRODUCTION" = true || {
            echo "::error::approve_production=true is required."
            exit 1
          }
          test "$CONFIRM_BACKUP" = true || {
            echo "::error::confirm_backup=true is required."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify immutable release identity
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.release_sha }}
          STAGING_ACCEPTED_SHA: ${{ inputs.staging_accepted_sha }}
        run: |
          actual_version=$(node -p "require('./package.json').version")
          actual_sha=$(git rev-parse HEAD)
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::release_sha must be a full 40-character lowercase commit SHA."
            exit 1
          }
          [[ "$STAGING_ACCEPTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::staging_accepted_sha must be a full 40-character lowercase commit SHA."
            exit 1
          }
          test "$actual_version" = "$EXPECTED_VERSION" || {
            echo "::error::Requested version $EXPECTED_VERSION does not match package version $actual_version."
            exit 1
          }
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "::error::Requested SHA $EXPECTED_SHA does not match main HEAD $actual_sha."
            exit 1
          }
          node scripts/ops/network-guard.mjs GitHub git fetch --no-tags origin main:refs/remotes/origin/main develop:refs/remotes/origin/develop
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || {
            echo "::error::release_sha is not the current remote main HEAD."
            exit 1
          }
          git cat-file -e "${STAGING_ACCEPTED_SHA}^{commit}" || {
            echo "::error::The accepted staging SHA is not available in repository history."
            exit 1
          }
          git merge-base --is-ancestor "$STAGING_ACCEPTED_SHA" origin/develop || {
            echo "::error::The accepted staging SHA is not part of the develop history."
            exit 1
          }
          git diff --quiet "$STAGING_ACCEPTED_SHA" "$actual_sha" -- . ':(exclude)infra/state/*.json' || {
            echo "::error::Production source differs from the accepted staging source."
            exit 1
          }
          echo "APP_VERSION=$actual_version" >> "$GITHUB_ENV"
          echo "GIT_SHA=$actual_sha" >> "$GITHUB_ENV"
      - run: corepack enable
      - name: Activate pinned pnpm
        run: node scripts/ops/network-guard.mjs npm/pnpm corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: node scripts/ops/network-guard.mjs npm/pnpm pnpm install --frozen-lockfile
      - name: Verify committed production state
        run: test -s infra/state/production.json
      - name: Validate workflow policy
        run: pnpm check:workflows
      - name: Test, typecheck, and build
        run: pnpm test && pnpm typecheck && pnpm build
      - name: Preflight release credentials
        run: pnpm ops preflight production --release
      - name: Release in safe order
        run: pnpm ops release production --approve-production --confirm-backup
      - name: Verify deployed API and web
        run: pnpm ops verify production
      - name: Preserve production release state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-state-production-${{ github.run_id }}
          path: infra/state/production.json
          if-no-files-found: error
          retention-days: 90
