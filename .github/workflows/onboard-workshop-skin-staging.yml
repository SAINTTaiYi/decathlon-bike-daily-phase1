name: Onboard workshop.skin to Staging · free stack

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: Hostname to attach (apex or www)
        required: true
        type: string
        default: workshop.skin
      confirm_free_plan:
        required: true
        type: boolean
        default: false
      confirm_staging_only:
        required: true
        type: boolean
        default: false
      confirm_not_production:
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: onboard-workshop-skin-staging
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/feature/cloudflare-workers-d1' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/ci/register-workshop-skin-onboard' || github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      HOSTNAME: ${{ inputs.hostname }}
    steps:
      - name: Guardrails
        env:
          CONFIRM_FREE_PLAN: ${{ inputs.confirm_free_plan }}
          CONFIRM_STAGING_ONLY: ${{ inputs.confirm_staging_only }}
          CONFIRM_NOT_PRODUCTION: ${{ inputs.confirm_not_production }}
        run: |
          set -euo pipefail
          test "$CONFIRM_FREE_PLAN" = true
          test "$CONFIRM_STAGING_ONLY" = true
          test "$CONFIRM_NOT_PRODUCTION" = true
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "02cb272ad6a5fd7e157a84061c8c5d42"
          test -n "$STAGING_BASE_URL"
          case "$HOSTNAME" in
            workshop.skin|www.workshop.skin) ;;
            *) echo "::error::hostname must be workshop.skin or www.workshop.skin"; exit 1 ;;
          esac

      - name: Create or load zone + attach Worker custom domain
        id: zone
        run: |
          set -euo pipefail
          ACCOUNT="$CLOUDFLARE_ACCOUNT_ID"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          echo "Listing zones for workshop.skin"
          ZONES=$(curl -fsS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones?name=workshop.skin")
          echo "$ZONES" | tee /tmp/zones.json
          ZONE_ID=$(node -e 'const j=require("/tmp/zones.json"); process.stdout.write((j.result&&j.result[0]&&j.result[0].id)||"")')

          if [ -z "$ZONE_ID" ]; then
            echo "Creating zone workshop.skin"
            CREATE=$(curl -sS "${AUTH[@]}" -X POST "https://api.cloudflare.com/client/v4/zones" \
              --data '{"name":"workshop.skin","account":{"id":"'"$ACCOUNT"'"},"type":"full","jump_start":false}')
            echo "$CREATE" | tee /tmp/zone-create.json
            node -e 'const j=require("/tmp/zone-create.json"); if(!j.success){console.error(JSON.stringify(j,null,2)); process.exit(1)}'
            ZONE_ID=$(node -e 'const j=require("/tmp/zone-create.json"); process.stdout.write(j.result.id)')
          fi

          DETAIL=$(curl -fsS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID")
          echo "$DETAIL" | tee /tmp/zone-detail.json
          NS=$(node -e 'const j=require("/tmp/zone-detail.json"); console.log((j.result.name_servers||[]).join("\n"))')
          STATUS=$(node -e 'const j=require("/tmp/zone-detail.json"); process.stdout.write(j.result.status||"")')
          echo "ZONE_ID=$ZONE_ID"
          echo "STATUS=$STATUS"
          echo "NAME_SERVERS:"
          echo "$NS"
          {
            echo "zone_id=$ZONE_ID"
            echo "zone_status=$STATUS"
          } >> "$GITHUB_OUTPUT"
          echo "$NS" > /tmp/ns.txt

          echo "Attaching custom domain $HOSTNAME -> bike-ops-staging"
          ATTACH=$(curl -sS "${AUTH[@]}" -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/domains" \
            --data '{"hostname":"'"$HOSTNAME"'","service":"bike-ops-staging","zone_id":"'"$ZONE_ID"'"}')
          echo "$ATTACH" | tee /tmp/attach.json
          # attach may fail until NS active; do not hard-fail the job on pending zone
          node -e 'const j=require("/tmp/attach.json"); if(j.success){console.log("ATTACH_OK", j.result && j.result.id)} else {console.log("ATTACH_PENDING_OR_FAIL"); console.log(JSON.stringify(j,null,2)); process.exitCode=0}'

          echo "Listing worker domains"
          curl -fsS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/domains" | tee /tmp/domains.json

      - name: Publish name servers for Aliyun
        run: |
          set -euo pipefail
          echo "## workshop.skin Cloudflare name servers" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Zone status: \`${{ steps.zone.outputs.zone_status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Zone id: \`${{ steps.zone.outputs.zone_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set these NS at 阿里云 DNS:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ns.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target Worker: \`bike-ops-staging\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Hostname: \`$HOSTNAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "After NS active, re-run this workflow if attach was pending." >> "$GITHUB_STEP_SUMMARY"
